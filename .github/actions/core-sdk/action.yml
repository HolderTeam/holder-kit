name: Fetch core SDK
description: Use the run-wide immutable core selection and verify cached SDK archives
inputs:
  commit:
    description: Resolved core commit
    required: true
runs:
  using: composite
  steps:
    - uses: HolderTeam/holder-core/.github/actions/core-sdk@shared-sdk-consumers
      with:
        commit: ${{ inputs.commit }}
    - name: Configure Python build tools
      shell: bash
      run: |
        echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
        echo "SKBUILD_CMAKE_BUILD_TYPE=$HOLDER_CORE_BUILD_TYPE" >> "$GITHUB_ENV"
