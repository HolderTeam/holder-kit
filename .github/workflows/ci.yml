name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      core_ref:
        description: Core version tag or full commit SHA (empty selects latest-green)
        required: false
        type: string
  workflow_call:
    inputs:
      core_ref:
        description: Exact published core commit to test
        required: true
        type: string
      python_ref:
        description: Python source revision (resolved once for all jobs)
        default: main
        type: string

permissions:
  contents: read

jobs:
  core-sdk:
    name: Resolve core SDK once
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      python_commit: ${{ steps.source.outputs.python_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: HolderTeam/holder-kit
          ref: ${{ github.repository == 'HolderTeam/holder-kit' && github.sha || inputs.python_ref || 'main' }}
          persist-credentials: false
      - id: source
        name: Record Python source revision
        shell: bash
        run: echo "python_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: resolve
        uses: HolderTeam/holder-core/.github/actions/core-sdk@main
        with:
          command: resolve
          core-ref: ${{ inputs.core_ref || 'latest-green' }}

  linux:
    needs: core-sdk
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: Ubuntu 24.04 / Python 3.12 / compatibility
            python-version: "3.12"
            comprehensive: true
            sanitized: false
          # Use the canonical SDK's distribution dependency ABI. Native
          # Ubuntu-series integration belongs to the Debian package builds.
          - runner: ubuntu-24.04
            name: Ubuntu 24.04 / Python 3.14 / shim sanitizers
            python-version: "3.14"
            comprehensive: false
            sanitized: true

    steps:
      - name: Check out Holder Kit
        uses: actions/checkout@v7
        with:
          repository: HolderTeam/holder-kit
          ref: ${{ needs.core-sdk.outputs.python_commit }}
          persist-credentials: false

      - name: Fetch verified core SDK
        uses: ./.github/actions/core-sdk
        with:
          commit: ${{ needs.core-sdk.outputs.commit }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3-dev \
            python3-venv \
            libssl-dev \
            nlohmann-json3-dev \
            libyaml-cpp-dev \
            libspdlog-dev \
            libsqlite3-dev \
            libsodium-dev \
            libgit2-dev \
            libmd4c-dev \
            libsecret-1-dev

      - name: Set up selected Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create isolated CI environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/holder-ci-venv"
          echo "${RUNNER_TEMP}/holder-ci-venv/bin" >> "${GITHUB_PATH}"

      - name: Install packaging tools
        run: python3 -m pip install --upgrade pip

      - name: Build and install Holder Kit with complete test dependencies
        if: ${{ matrix.comprehensive }}
        run: python3 -m pip install --verbose '.[test]'

      - name: Build instrumented Holder Kit for lifecycle smoke tests
        if: ${{ matrix.sanitized }}
        run: python3 -m pip install --verbose --config-settings=cmake.define.HOLDER_PYTHON_SANITIZE=address,undefined . 'pytest>=8'

      - name: Configure sanitizer runtime
        if: ${{ matrix.sanitized }}
        run: |
          asan_library="$(gcc -print-file-name=libasan.so)"
          if ! file -L "${asan_library}" | grep -q 'ELF'; then
            asan_library="$(ldconfig -p | awk '/libasan\.so/{print $NF; exit}')"
          fi
          test -f "${asan_library}"
          echo "LD_PRELOAD=${asan_library}" >> "${GITHUB_ENV}"
          echo "ASAN_OPTIONS=detect_leaks=0:halt_on_error=1" >> "${GITHUB_ENV}"
          echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1" >> "${GITHUB_ENV}"

      - name: Show installed build
        run: |
          python3 --version
          python3 -c 'import sys; print(sys.executable)'
          python3 -m pip show holder-kit
          python3 -c 'import holderkit; print(holderkit.__file__)'

      - name: Run instrumented Python lifecycle smoke tests
        if: ${{ matrix.sanitized }}
        run: |
          python3 -m pytest --verbose \
            tests/test_holder.py::test_native_extension_imports \
            tests/test_holder.py::test_complete_card_lifecycle \
            tests/test_holder.py::test_context_destruction_releases_native_resources

      - name: Run complete Python tests
        if: ${{ matrix.comprehensive }}
        run: python3 -m pytest --verbose

      - name: Run strict type checking
        if: ${{ matrix.comprehensive }}
        run: python3 -m mypy

      - name: Run lifecycle example
        run: python3 examples/card_lifecycle.py

      - name: Run detached-record and pandas examples
        if: ${{ matrix.comprehensive }}
        run: |
          python3 examples/detached_records.py
          python3 examples/pandas_analysis.py

      - name: Build wheel
        if: ${{ matrix.comprehensive }}
        run: |
          python3 -m pip install build
          python3 -m build --wheel --outdir dist
          ls -lh dist

      - name: Install wheel in a fresh base environment
        if: ${{ matrix.comprehensive }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/holder-wheel-venv"
          "${RUNNER_TEMP}/holder-wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/holder-wheel-venv/bin/python" -m pip install --verbose dist/*.whl

      - name: Smoke-test installed wheel without pandas
        if: ${{ matrix.comprehensive }}
        run: |
          "${RUNNER_TEMP}/holder-wheel-venv/bin/python" - <<'PY'
          import importlib.util
          import json
          from importlib.metadata import distribution
          from importlib.resources import files
          import sys
          import tempfile
          from pathlib import Path

          assert importlib.util.find_spec("pandas") is None

          import holderkit
          from holderkit import _native

          installed = distribution("holder-kit")
          assert installed.metadata["Name"] == "holder-kit"
          assert installed.files is not None
          assert all(path.parts[0] != "holder" for path in installed.files)
          assert importlib.util.find_spec("holder") is None
          assert _native.__name__ == "holderkit._native"
          assert _native.Context.__module__ == "holderkit._native"
          assert holderkit.HolderError.__module__ == "holderkit._native"
          resources = files("holderkit")
          assert resources.joinpath("py.typed").is_file()
          assert resources.joinpath("_schema.sql").read_text(encoding="utf-8")
          assert json.loads(resources.joinpath("_core_build.json").read_text(encoding="utf-8"))

          assert "pandas" not in sys.modules
          with tempfile.TemporaryDirectory(prefix="holder-wheel-smoke-") as temporary:
              with holderkit.open(Path(temporary) / "data") as context:
                  project = context.create_project("Wheel smoke test")
                  card = context.create_card(
                      project.project_id, "Installed wheel", "standalone body"
                  )
                  assert context.get_card_content(card.card_id) == "standalone body"
                  assert context.cards.to_records(project.project_id)[0]["card_id"] == card.card_id
                  try:
                      context.cards.to_dataframe(project.project_id)
                  except ModuleNotFoundError as error:
                      assert "holder-kit[pandas]" in str(error)
                  else:
                      raise AssertionError("base wheel unexpectedly provided pandas")
          PY

  macos:
    needs: core-sdk
    name: macOS 15 / Python 3.12
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Holder Kit
        uses: actions/checkout@v7
        with:
          repository: HolderTeam/holder-kit
          ref: ${{ needs.core-sdk.outputs.python_commit }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch verified core SDK
        uses: ./.github/actions/core-sdk
        with:
          commit: ${{ needs.core-sdk.outputs.commit }}

      - name: Install native build dependencies
        run: |
          brew install \
            cmake \
            ninja \
            pkg-config \
            nlohmann-json \
            yaml-cpp \
            spdlog \
            sqlite \
            libsodium \
            libgit2 \
            md4c \
            openssl@3

      - name: Build and install Holder Kit
        run: |
          python3 -m pip install --upgrade pip
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openssl@3) -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            python3 -m pip install --verbose . 'pytest>=8'

      - name: Run base Python tests
        run: python3 -m pytest --verbose tests/test_holder.py

      - name: Run lifecycle example
        run: python3 examples/card_lifecycle.py

  windows:
    needs: core-sdk
    name: Windows Server 2025 / Python 3.12
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out Holder Kit
        uses: actions/checkout@v7
        with:
          repository: HolderTeam/holder-kit
          ref: ${{ needs.core-sdk.outputs.python_commit }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch verified core SDK
        uses: ./.github/actions/core-sdk
        with:
          commit: ${{ needs.core-sdk.outputs.commit }}

      - name: Build and install Holder Kit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --verbose . "pytest>=8"

      - name: Verify native extension and bundled runtime dependencies
        run: python -c "import holderkit; print(holderkit.__file__)"

      - name: Run base Python tests
        run: python -m pytest --verbose tests/test_holder.py

      - name: Run lifecycle example
        run: python examples/card_lifecycle.py
