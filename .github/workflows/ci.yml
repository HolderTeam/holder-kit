name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: Ubuntu 24.04 / Python 3.12 / compatibility
            python-version: "3.12"
            comprehensive: true
            sanitized: false
          - runner: ubuntu-26.04
            name: Ubuntu 26.04 / Python 3.14 / native + sanitizers
            python-version: "3.14"
            comprehensive: false
            sanitized: true

    steps:
      - name: Check out holder-python and holder-core
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3-dev \
            python3-venv \
            libssl-dev \
            nlohmann-json3-dev \
            libyaml-cpp-dev \
            libspdlog-dev \
            libsqlite3-dev \
            libsodium-dev \
            libgit2-dev \
            libmd4c-dev \
            libsecret-1-dev

      - name: Verify runner Python
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          expected = os.environ["EXPECTED_PYTHON"]
          print(sys.version)
          if actual != expected:
              raise SystemExit(f"expected Python {expected}, found {actual}")
          PY

      - name: Create isolated CI environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/holder-ci-venv"
          echo "${RUNNER_TEMP}/holder-ci-venv/bin" >> "${GITHUB_PATH}"

      - name: Install holder-core test dependency
        if: ${{ matrix.sanitized }}
        run: sudo apt-get install -y --no-install-recommends catch2

      - name: Install packaging tools
        run: python3 -m pip install --upgrade pip

      - name: Build and install holder-python with complete test dependencies
        if: ${{ matrix.comprehensive }}
        run: python3 -m pip install --verbose '.[test]'

      - name: Build instrumented holder-python for lifecycle smoke tests
        if: ${{ matrix.sanitized }}
        env:
          CMAKE_ARGS: -DHOLDER_PYTHON_SANITIZE=address,undefined
        run: python3 -m pip install --verbose . 'pytest>=8'

      - name: Run holder-core tests with ASan and UBSan
        if: ${{ matrix.sanitized }}
        working-directory: submodules/holder-core
        env:
          TMPDIR: ${{ runner.temp }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: ./make.sh san address,undefined

      - name: Configure sanitizer runtime
        if: ${{ matrix.sanitized }}
        run: |
          asan_library="$(gcc -print-file-name=libasan.so)"
          if ! file -L "${asan_library}" | grep -q 'ELF'; then
            asan_library="$(ldconfig -p | awk '/libasan\.so/{print $NF; exit}')"
          fi
          test -f "${asan_library}"
          echo "LD_PRELOAD=${asan_library}" >> "${GITHUB_ENV}"
          echo "ASAN_OPTIONS=detect_leaks=0:halt_on_error=1" >> "${GITHUB_ENV}"
          echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1" >> "${GITHUB_ENV}"

      - name: Show installed build
        run: |
          python3 --version
          python3 -c 'import sys; print(sys.executable)'
          python3 -m pip show holder
          python3 -c 'import holder; print(holder.__file__)'

      - name: Run instrumented Python lifecycle smoke tests
        if: ${{ matrix.sanitized }}
        run: |
          python3 -m pytest --verbose \
            tests/test_holder.py::test_native_extension_imports \
            tests/test_holder.py::test_complete_card_lifecycle \
            tests/test_holder.py::test_context_destruction_releases_native_resources \
            tests/test_holder.py::test_failed_context_initialization_releases_partial_state

      - name: Run complete Python tests
        if: ${{ matrix.comprehensive }}
        run: python3 -m pytest --verbose

      - name: Run strict type checking
        if: ${{ matrix.comprehensive }}
        run: python3 -m mypy

      - name: Run lifecycle example
        run: python3 examples/card_lifecycle.py

      - name: Run detached-record and pandas examples
        if: ${{ matrix.comprehensive }}
        run: |
          python3 examples/detached_records.py
          python3 examples/pandas_analysis.py

      - name: Build wheel
        if: ${{ matrix.comprehensive }}
        run: |
          python3 -m pip install build
          python3 -m build --wheel --outdir dist
          ls -lh dist

      - name: Install wheel in a fresh base environment
        if: ${{ matrix.comprehensive }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/holder-wheel-venv"
          "${RUNNER_TEMP}/holder-wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/holder-wheel-venv/bin/python" -m pip install --verbose dist/*.whl

      - name: Smoke-test installed wheel without pandas
        if: ${{ matrix.comprehensive }}
        run: |
          "${RUNNER_TEMP}/holder-wheel-venv/bin/python" - <<'PY'
          import importlib.util
          import sys
          import tempfile
          from pathlib import Path

          assert importlib.util.find_spec("pandas") is None

          import holder

          assert "pandas" not in sys.modules
          with tempfile.TemporaryDirectory(prefix="holder-wheel-smoke-") as temporary:
              with holder.open(Path(temporary) / "data") as context:
                  project = context.create_project("Wheel smoke test")
                  card = context.create_card(
                      project.project_id, "Installed wheel", "standalone body"
                  )
                  assert context.get_card_content(card.card_id) == "standalone body"
                  assert context.cards.to_records(project.project_id)[0]["card_id"] == card.card_id
                  try:
                      context.cards.to_dataframe(project.project_id)
                  except ModuleNotFoundError as error:
                      assert "holder[pandas]" in str(error)
                  else:
                      raise AssertionError("base wheel unexpectedly provided pandas")
          PY

  macos:
    name: macOS 15 / Python 3.12
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out holder-python and holder-core
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          brew install \
            cmake \
            ninja \
            pkg-config \
            nlohmann-json \
            yaml-cpp \
            spdlog \
            sqlite \
            libsodium \
            libgit2 \
            md4c \
            openssl@3

      - name: Build and install holder-python
        run: |
          python3 -m pip install --upgrade pip
          CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openssl@3) -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" \
            python3 -m pip install --verbose . 'pytest>=8'

      - name: Run base Python tests
        run: python3 -m pytest --verbose tests/test_holder.py

      - name: Run lifecycle example
        run: python3 examples/card_lifecycle.py

  windows:
    name: Windows Server 2025 / Python 3.12
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out holder-python and holder-core
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set vcpkg paths
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\.vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary package cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: holder-python-vcpkg-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            holder-python-vcpkg-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}-
            holder-python-vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Build and install holder-python
        shell: pwsh
        run: |
          $workspace = (Resolve-Path ".").Path.Replace('\', '/')
          $vcpkgRoot = $env:VCPKG_ROOT.Replace('\', '/')
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_DIR=$workspace/submodules/holder-core -DVCPKG_INSTALLED_DIR=$workspace/.vcpkg-installed"
          python -m pip install --upgrade pip
          python -m pip install --verbose . "pytest>=8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$workspace/.vcpkg-installed/x64-windows/bin" >> $env:GITHUB_PATH

      - name: Run base Python tests
        run: python -m pytest --verbose tests/test_holder.py

      - name: Run lifecycle example
        run: python examples/card_lifecycle.py

      - name: Save vcpkg binary package cache
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: holder-python-vcpkg-${{ runner.os }}-${{ hashFiles('submodules/holder-core/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
