[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "holder-kit"
version = "0.0.2"
description = "Holder Kit: CPython bindings for embedded libholder"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.optional-dependencies]
test = ["mypy>=1.15", "pandas", "pandas-stubs", "pytest>=8", "networkx", "types-networkx"]
pandas = ["pandas", "pandas-stubs"]
graph = ["networkx", "types-networkx"]

[project.urls]
Repository = "https://github.com/HolderTeam/holder-kit"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.build-type = "RelWithDebInfo"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/holderkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src/holderkit", "examples", "tests", "scripts/develop.py"]
