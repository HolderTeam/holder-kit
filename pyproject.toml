[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "holder"
version = "0.1.0"
description = "CPython bindings for embedded libholder"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/HolderTeam/holder-python"

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/holder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
